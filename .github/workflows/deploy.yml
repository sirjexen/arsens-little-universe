# Deploy Arsen's Little Universe to GitHub Pages via GitHub Actions.
#
# HOW TO ENABLE (do this once on github.com):
# 1. Push this repository to GitHub.
# 2. Open the repo → Settings → Pages.
# 3. Under "Build and deployment", set Source to "GitHub Actions".
# 4. Push to the `main` branch (or run the workflow manually from the Actions tab).
# 5. The site will be live at https://<username>.github.io/arsens-little-universe/
#
# NOTE: vite.config.ts sets `base: '/arsens-little-universe/'` so that all
# asset URLs work under the repository subpath. If you rename the repository,
# update the `base` value in vite.config.ts to match '/<new-name>/'.

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
